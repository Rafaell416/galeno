name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: swift
    runs-on: macos-latest
    defaults:
      run:
        working-directory: GalenoCore
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift build
      - run: swift test

  go:
    name: go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # Línea roja: el bridge envía por un solo camino (docs/09 §4.5). La
      # llamada a whatsmeow que envía solo puede estar en outbox.go, que es
      # donde "sync" despacha la bandeja de salida con todas sus guardas. Si
      # aparece en otro archivo, alguien abrió un segundo camino de envío.
      # El patrón busca los identificadores reales del puente, no los nombres
      # de las herramientas MCP. La misma comprobación corre en "go test"
      # (TestSendCallOnlyInOutbox), para que salte también en local.
      - name: el envío solo vive en outbox.go
        run: |
          if grep -rnE 'client\.SendMessage\(' . --include="*.go" | grep -vE '(^|/)outbox\.go:'; then
            echo "::error::client.SendMessage( solo puede aparecer en whatsapp-bridge/outbox.go."
            exit 1
          fi

      # Lo que el bridge no hace nunca, en ningún archivo: subir archivos
      # (adjuntos, audios), el servidor HTTP de envío de upstream, marcar como
      # leído y avisar «en línea» o «escribiendo…».
      - name: sin adjuntos, leídos ni presencia
        run: |
          if grep -rnE 'client\.Upload\(|/api/send|MarkRead|SendPresence|SendChatPresence' . --include="*.go"; then
            echo "::error::El bridge de WhatsApp solo envía texto: sin adjuntos, sin marcar leído y sin avisos de presencia."
            exit 1
          fi

  # El job "go" corre en Linux y solo prueba el código. Este compila el binario
  # que de verdad se empaqueta en la app: universal (arm64 + x86_64), con cgo
  # para go-sqlite3, y por eso necesita macOS y el clang de Xcode.
  go-universal:
    name: go-universal
    runs-on: macos-latest
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum
      - run: make universal
      - name: el binario tiene arm64 y x86_64
        run: |
          archs="$(lipo -archs bin/galeno-whatsapp)"
          echo "Arquitecturas: $archs"
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *)
                echo "::error::El binario universal no tiene $arch (tiene: $archs)."
                exit 1
                ;;
            esac
          done
      # Que arranque, no solo que compile: el runner corre la mitad que le toca.
      - run: ./bin/galeno-whatsapp version

  # La app de Mac. Corre solo GalenoTests: los UI tests (GalenoUITests) piden un
  # entorno gráfico completo y tardan; se dejan para correrlos a mano en Xcode.
  # Firma ad hoc, sin equipo de desarrollo: la firma real llega en la Fase 8.
  app:
    name: app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - run: >
          xcodebuild
          -project GalenoApp/Galeno.xcodeproj
          -scheme Galeno
          -destination 'platform=macOS'
          -only-testing:GalenoTests
          test
