name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: swift
    runs-on: macos-latest
    defaults:
      run:
        working-directory: GalenoCore
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift build
      - run: swift test

  go:
    name: go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # Línea roja: el bridge de WhatsApp nunca tiene herramientas de envío.
      # Si este paso falla, alguien las reintrodujo. El patrón busca los
      # identificadores reales del puente (whatsmeow + el handler HTTP), no
      # los nombres de las herramientas del servidor MCP en Python de upstream
      # (send_message/send_file/send_audio_message): esos nunca aparecen en
      # este código, así que ese patrón no habría servido de nada aquí.
      - name: sin herramientas de envío
        run: |
          if grep -rnE 'client\.SendMessage\(|client\.Upload\(|/api/send|MarkRead|SendPresence|SendChatPresence' . --include="*.go"; then
            echo "::error::El bridge de WhatsApp es de solo lectura: no puede tener herramientas de envío."
            exit 1
          fi

  # El job "go" corre en Linux y solo prueba el código. Este compila el binario
  # que de verdad se empaqueta en la app: universal (arm64 + x86_64), con cgo
  # para go-sqlite3, y por eso necesita macOS y el clang de Xcode.
  go-universal:
    name: go-universal
    runs-on: macos-latest
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum
      - run: make universal
      - name: el binario tiene arm64 y x86_64
        run: |
          archs="$(lipo -archs bin/galeno-whatsapp)"
          echo "Arquitecturas: $archs"
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *)
                echo "::error::El binario universal no tiene $arch (tiene: $archs)."
                exit 1
                ;;
            esac
          done
      # Que arranque, no solo que compile: el runner corre la mitad que le toca.
      - run: ./bin/galeno-whatsapp version
